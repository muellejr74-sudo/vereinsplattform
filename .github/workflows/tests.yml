# Automatische Tests der Vereinsplattform.
#
# Läuft bei jedem Hochladen (Push) auf GitHub:
#   - PHP 8.3 (Mindestversion) und PHP 8.4 (Version auf lima-city)
#   - gegen eine echte MySQL-Datenbank, wie bei lima-city
#
# Fehlt die Datei composer.lock noch, wird sie einmalig erzeugt und automatisch
# ins Repository übernommen (technische Notiz T0-6).

name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: Tests mit PHP ${{ matrix.php }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Code holen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, intl, bcmath, gd
          coverage: none

      - name: Abhängigkeiten installieren
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-interaction --no-progress
          else
            echo "composer.lock fehlt – wird erzeugt (Pakete passend zu PHP 8.3, siehe config.platform)."
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: composer.lock aufbewahren
        if: matrix.php == '8.3' && hashFiles('composer.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          retention-days: 1

      - name: Umgebungsdatei anlegen
        run: cp .env.example .env

      - name: Anwendungsschlüssel erzeugen
        run: php artisan key:generate

      - name: Tests ausführen
        run: php artisan test

  composer-lock-uebernehmen:
    name: composer.lock ins Repository übernehmen
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Prüfen, ob composer.lock schon vorhanden ist
        id: pruefung
        run: |
          if [ -f composer.lock ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
          else
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
          fi

      - name: Erzeugte composer.lock laden
        if: steps.pruefung.outputs.vorhanden == 'nein'
        uses: actions/download-artifact@v4
        with:
          name: composer-lock

      - name: composer.lock hochladen
        if: steps.pruefung.outputs.vorhanden == 'nein'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "composer.lock automatisch erzeugt (Stufe 0, T0-6)"
          git push
